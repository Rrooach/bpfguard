[workspace]
members = [
    "crates/schema",
    "crates/state-oracle",
    "crates/recorder",
    "crates/system-effects-recorder",
    "crates/filesystem-confirmer",
    "crates/linux-state-confirmers",
    "crates/deployment",
    "crates/deployment-observer",
    "crates/comparator",
    "crates/observerd",
    "crates/harness-auth",
    "crates/load-sampler",
    "crates/file-profiler",
]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
