[package]
name = "bpf-observer-deployment-observer"
version = "0.1.0"
edition = "2021"
rust-version = "1.67"
license = "GPL-2.0-only"

[dependencies]
anyhow = "=1.0.66"
hex = "=0.4.3"
libc = "=0.2.137"
serde = { version = "=1.0.147", features = ["derive"] }
serde_json = "=1.0.87"
sha2 = "=0.10.6"
bpf-observer-deployment = { path = "../deployment" }
bpf-observer-comparator = { path = "../comparator" }
bpf-observer-filesystem-confirmer = { path = "../filesystem-confirmer" }
bpf-observer-linux-state-confirmers = { path = "../linux-state-confirmers" }
bpf-observer-oracle = { package = "bpf-observer-state-oracle", path = "../state-oracle" }
bpf-observer-schema = { path = "../schema" }
bpf-observer-system-effects = { path = "../system-effects-recorder" }

[[bin]]
name = "deployment-observe"
path = "src/bin/deployment-observe.rs"

[[bin]]
name = "deployment-observe-verify"
path = "src/bin/deployment-observe-verify.rs"
