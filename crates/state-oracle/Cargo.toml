[package]
name = "bpf-observer-state-oracle"
version = "0.1.0"
edition = "2021"
rust-version = "1.67"
license = "GPL-2.0-only"

[dependencies]
anyhow = "=1.0.66"
bpf-observer-schema = { path = "../schema" }
hex = "=0.4.3"
itoa = "=1.0.4"
libbpf-sys = "=1.0.4"
libc = "=0.2.137"
# Keep serde_derive's transitive proc-macro stack within the workspace's
# declared Rust 1.67 MSRV.  Newer quote releases require a newer compiler.
proc-macro2 = "=1.0.47"
quote = "=1.0.21"
ryu = "=1.0.11"
unicode-ident = "=1.0.5"
serde_json = "=1.0.87"
sha2 = "=0.10.6"
