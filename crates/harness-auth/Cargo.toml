[package]
name = "bpf-harness-auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.67"
license = "GPL-2.0-only"

[lib]
name = "bpf_harness_auth"
path = "src/lib.rs"

[[bin]]
name = "bpf-harnessd"
path = "src/bin/bpf-harnessd.rs"

[dependencies]
anyhow = "=1.0.66"
clap = { version = "=3.2.23", features = ["derive"] }
ed25519-dalek = "=1.0.1"
libc = "=0.2.137"
serde = { version = "=1.0.147", features = ["derive"] }
serde_json = "=1.0.87"
sha2 = "=0.10.6"
bpf-observer-schema = { path = "../schema" }
